# custom aapt2 execute location (khusus build dari HP/Termux — hapus baris ini di PC)
android.aapt2FromMavenOverride=/usr/bin/aapt2

android.useAndroidX=true
# enableJetifier DIMATIKAN: tidak ada dependensi support-library lama di project ini,
# jadi rewrite Jetifier cuma memperlambat build. Kalau build gagal dengan error
# "support library"/android.support.*, nyalakan lagi jadi true.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin compiler jalan in-process — mencegah daemon Kotlin mati saat low-RAM
# (mencegah daemon Kotlin mati saat build dari HP low-RAM)
kotlin.compiler.execution.strategy=in-process

# FITUR STRAVA — Google Maps API key (key TES; batasi ke package com.zaaam.Zmusic
# + SHA-1 debug di Google Cloud, dan rotate setelah selesai tes). Build membaca
# ini via project property (lihat app/build.gradle.kts).
MAPS_API_KEY=AIzaSyDHhu10PJILJNU6Af_KqMLf0jJB2HhmTqo
