# custom aapt2 execute location (khusus build dari HP/Termux — hapus baris ini di PC)
android.aapt2FromMavenOverride=/usr/bin/aapt2

android.useAndroidX=true
# enableJetifier DIMATIKAN: tidak ada dependensi support-library lama di project ini,
# jadi rewrite Jetifier cuma memperlambat build. Kalau build gagal dengan error
# "support library"/android.support.*, nyalakan lagi jadi true.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin compiler jalan in-process — mencegah daemon Kotlin mati saat low-RAM
# (rekomendasi CLAUDE.md §9 untuk build dari HP)
kotlin.compiler.execution.strategy=in-process
