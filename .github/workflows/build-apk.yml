name: Build APK ZRun

# Semua build jalan di GitHub Actions — JANGAN build rilis di env lokal.
# - Push ke main (non-docs) → build debug + upload artifact.
# - Push tag v* (mis. v1.0.0) → build debug + buat GitHub Release + lampirkan APK.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'patches/**'
      - 'Ztube/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties berisi override aapt2 khusus build dari HP (Termux:
      # android.aapt2FromMavenOverride=/usr/bin/aapt2). Path itu tidak ada di
      # runner CI — hapus barisnya di sini saja; file di repo tetap utuh
      # supaya build di HP tetap jalan.
      - name: Hapus override aapt2 khusus Termux
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zrun-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Build release sengaja dimatikan di CI (hemat waktu runner; cukup debug).
      # Infrastruktur signing via Secrets ZMUSIC_* tetap ada di build.gradle.kts —
      # kalau mau release lagi, kembalikan step assembleRelease dari riwayat git.

  release:
    # Hanya jalan saat push tag v* — APK diambil dari artifact job build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Unduh APK dari artifact
        uses: actions/download-artifact@v4
        with:
          name: zrun-debug-apk
          path: dist

      - name: Buat GitHub Release + lampirkan APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK="dist/zrun-${TAG}-debug.apk"
          cp dist/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "ZRun $TAG" \
              --notes "APK debug ZRun $TAG — langsung bisa di-install di HP."
          fi
