name: Build APK ZRun

# Semua build jalan di GitHub Actions — JANGAN build rilis di env lokal.
# - Push ke main (non-docs) → build debug + release + upload artifact.
# - Push tag v* (mis. v1.0.1) → build + buat GitHub Release + lampirkan APK.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'patches/**'
      - 'Ztube/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties berisi override aapt2 khusus build dari HP (Termux:
      # android.aapt2FromMavenOverride=/usr/bin/aapt2). Path itu tidak ada di
      # runner CI — hapus barisnya di sini saja; file di repo tetap utuh
      # supaya build di HP tetap jalan.
      - name: Hapus override aapt2 khusus Termux
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (R8, signed debug keystore)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zrun-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zrun-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Signing release-store (Play) via Secrets ZMUSIC_* tetap didukung di
      # build.gradle.kts — kalau secret-nya ada, otomatis dipakai.

  release:
    # Hanya jalan saat push tag v* — APK diambil dari artifact job build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Unduh APK dari artifact
        uses: actions/download-artifact@v4
        with:
          pattern: zrun-*-apk
          path: dist

      - name: Buat GitHub Release + lampirkan APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp dist/zrun-debug-apk/app-debug.apk "dist/zrun-${TAG}-debug.apk"
          cp dist/zrun-release-apk/app-release.apk "dist/zrun-${TAG}-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/zrun-${TAG}-debug.apk" "dist/zrun-${TAG}-release.apk" --clobber
          else
            gh release create "$TAG" "dist/zrun-${TAG}-debug.apk" "dist/zrun-${TAG}-release.apk" \
              --title "ZRun $TAG" \
              --notes "ZRun $TAG — release (R8, ringan) untuk harian; debug untuk ngoprek. Langsung bisa di-install."
          fi
